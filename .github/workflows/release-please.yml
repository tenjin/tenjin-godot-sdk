name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/ci.yml

  # Attaches the installable addon (addons/tenjin, built by ci.yml, plus
  # LICENSE) to the GitHub release. The Godot Asset Library listing downloads
  # this zip (Custom provider), so its layout is what the Asset Library
  # expects.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tenjin-godot-sdk
          path: addons/

      - name: Package addon
        run: zip -r "tenjin-godot-sdk-${TAG}.zip" addons/tenjin
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload to release
        run: gh release upload "$TAG" "tenjin-godot-sdk-${TAG}.zip" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
